name: Nancy.Plots.Tikz-test

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'Nancy/Nancy.Plots/Nancy.Plots.Tikz/*'
      - 'Nancy/Nancy.Plots/Nancy.Plots.Tikz.Tests/*'
  pull_request:
    branches:
      - master
    paths:
      - 'Nancy/Nancy.Plots/Nancy.Plots.Tikz/*'
      - 'Nancy/Nancy.Plots/Nancy.Plots.Tikz.Tests/*'

jobs:
  Nancy-Plots-Tikz-test:
    runs-on: ubuntu-latest

    env:
      BUILD_CONFIG: "Release"
      SOLUTION: "Nancy/Nancy.Plots/Nancy.Plots.sln"
      NANCY_PLOTS_TIKZ: "Nancy/Nancy.Plots/Nancy.Plots.Tikz/Nancy.Plots.Tikz.csproj"
      NANCY_PLOTS_TIKZ_TESTS: "Nancy/Nancy.Plots/Nancy.Plots.Tikz.Tests/Nancy.Plots.Tikz.Tests.csproj"

    steps:
      - uses: actions/checkout@v6

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build Nancy.Plots.Tikz
        run: dotnet build $NANCY_PLOTS_TIKZ --configuration $BUILD_CONFIG

      - name: Build Nancy.Plots.Tikz.Tests
        run: dotnet build $NANCY_PLOTS_TIKZ_TESTS --configuration $BUILD_CONFIG

      - name: Test Nancy.Plots.Tikz
        run: dotnet test --project $NANCY_PLOTS_TIKZ_TESTS --configuration $BUILD_CONFIG --framework net10.0
